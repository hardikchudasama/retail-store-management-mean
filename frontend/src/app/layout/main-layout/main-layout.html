<div class="app-layout">
  <app-sidebar
    [isOpen]="isSidebarOpen"
    (closeSidebar)="closeSidebar()"
  />

  @if (isSidebarOpen) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close navigation menu"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="main-content">
    <app-header (menuToggle)="toggleSidebar()" />

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
